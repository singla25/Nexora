<div class="profile-registration-form-div"><form id="profile-registration-form" class="profile-registration-form" enctype="multipart/form-data"><h2>Create Your Account</h2><div class="profile-registration-form-grid"><!-- FULL WIDTH --><input type="email" name="email" placeholder="Email *" class="full-width" required><!-- ROW 1 --><input type="text" name="user_name" placeholder="User Name *" required><select name="gender" required><option value="">Select Gender *</option><option value="male">Male</option><option value="female">Female</option><option value="other">Other</option></select><!-- ROW 2 --><input type="text" name="first_name" placeholder="First Name *" required><input type="text" name="last_name" placeholder="Last Name *" required><!-- ROW 3 --><input type="text" name="phone" placeholder="Phone *" required><input type="text" name="birthdate" placeholder="Date of Birth *" required onfocus="(this.type='date')" onblur="if(!this.value)this.type='text'"><!-- ROW 4 --><input type="password" name="password" placeholder="Password * (min 8 characters)" minlength="8" required><input type="password" name="confirm_password" placeholder="Confirm Password *" required><!-- 🔥 Toggle Switch --><div class="password-toggle-wrapper full-width"><label class="switch"><input type="checkbox" id="toggle-passwords"><span class="slider"></span></label><span class="toggle-label">Show Password</span></div></div><fieldset class="nx-account-choice"><legend>I want to join as</legend><label><input type="radio" name="intent" value="customer" checked> Customer</label><label><input type="radio" name="intent" value="seller"> Seller</label></fieldset><div class="nx-seller-fields" hidden><h3>Business details</h3><div class="nx-vendor-fields"><div class="nx-vendor-field full-width"><label for="nx-signup-business_name">Business name *</label><input type="text" id="nx-signup-business_name" name="business_name" value="" aria-describedby="nx-signup-business_name-error"><span class="nx-field-error" id="nx-signup-business_name-error" role="alert"></span></div><div class="nx-vendor-field "><label for="nx-signup-business_type">Business type *</label><select id="nx-signup-business_type" name="business_type" aria-describedby="nx-signup-business_type-error"><option value="">Select business type</option><option value="sole_proprietorship" >Sole proprietorship</option><option value="partnership" >Partnership</option><option value="llp" >LLP</option><option value="private_limited" >Private limited</option><option value="other" >Other</option></select><span class="nx-field-error" id="nx-signup-business_type-error" role="alert"></span></div><div class="nx-vendor-field "><label for="nx-signup-gstin">GSTIN *</label><input type="text" id="nx-signup-gstin" name="gstin" value="" maxlength="15" autocapitalize="characters" pattern="[0-9]{2}[A-Za-z]{5}[0-9]{4}[A-Za-z][1-9A-Za-z]Z[0-9A-Za-z]" aria-describedby="nx-signup-gstin-error"><span class="nx-field-error" id="nx-signup-gstin-error" role="alert"></span></div><div class="nx-vendor-field "><label for="nx-signup-business_email">Business email *</label><input type="email" id="nx-signup-business_email" name="business_email" value="" aria-describedby="nx-signup-business_email-error"><span class="nx-field-error" id="nx-signup-business_email-error" role="alert"></span></div><div class="nx-vendor-field "><label for="nx-signup-business_phone">Business phone *</label><input type="text" id="nx-signup-business_phone" name="business_phone" value="" aria-describedby="nx-signup-business_phone-error"><span class="nx-field-error" id="nx-signup-business_phone-error" role="alert"></span></div><div class="nx-vendor-field full-width"><label for="nx-signup-business_address">Address *</label><input type="text" id="nx-signup-business_address" name="business_address" value="" aria-describedby="nx-signup-business_address-error"><span class="nx-field-error" id="nx-signup-business_address-error" role="alert"></span></div><div class="nx-vendor-field "><label for="nx-signup-business_city">City *</label><input type="text" id="nx-signup-business_city" name="business_city" value="" aria-describedby="nx-signup-business_city-error"><span class="nx-field-error" id="nx-signup-business_city-error" role="alert"></span></div><div class="nx-vendor-field "><label for="nx-signup-business_state">State *</label><input type="text" id="nx-signup-business_state" name="business_state" value="" aria-describedby="nx-signup-business_state-error"><span class="nx-field-error" id="nx-signup-business_state-error" role="alert"></span></div><div class="nx-vendor-field "><label for="nx-signup-business_pincode">Pincode *</label><input type="text" id="nx-signup-business_pincode" name="business_pincode" value="" maxlength="6" inputmode="numeric" aria-describedby="nx-signup-business_pincode-error"><span class="nx-field-error" id="nx-signup-business_pincode-error" role="alert"></span></div></div></div><button type="submit" class="profile-registration-form-btn">Create Account</button><div class="profile-registration-extra"> Already have an account? <a href="http://localhost83.local.com/nexora/login-page">Login</a></div></form></div>
