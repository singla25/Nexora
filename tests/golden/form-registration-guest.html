<div class="profile-registration-form-div"><form id="profile-registration-form" class="profile-registration-form" enctype="multipart/form-data"><h2>Create Your Account</h2><div class="profile-registration-form-grid"><!-- FULL WIDTH --><input type="email" name="email" placeholder="Email *" class="full-width" required><!-- ROW 1 --><input type="text" name="user_name" placeholder="User Name *" required><select name="gender" required><option value="">Select Gender *</option><option value="male">Male</option><option value="female">Female</option><option value="other">Other</option></select><!-- ROW 2 --><input type="text" name="first_name" placeholder="First Name *" required><input type="text" name="last_name" placeholder="Last Name *" required><!-- ROW 3 --><input type="text" name="phone" placeholder="Phone *" required><input type="text" name="birthdate" placeholder="Date of Birth *" required onfocus="(this.type='date')" onblur="if(!this.value)this.type='text'"><!-- ROW 4 --><input type="password" name="password" placeholder="Password * (min 8 characters)" minlength="8" required><input type="password" name="confirm_password" placeholder="Confirm Password *" required><!-- 🔥 Toggle Switch --><div class="password-toggle-wrapper full-width"><label class="switch"><input type="checkbox" id="toggle-passwords"><span class="slider"></span></label><span class="toggle-label">Show Password</span></div></div><button type="submit" class="profile-registration-form-btn">Create Account</button><div class="profile-registration-extra"> Already have an account? <a href="http://localhost83.local.com/nexora/login-page">Login</a></div></form></div>
